apiVersion: v2
name: notdawa
description: >-
  Self-hosted, DAWA-compatible Danish address API backed by a local PostgreSQL +
  PostGIS mirror of the Datafordeler registers. Bundles the database, the API
  server, a per-deploy data-provisioning job and a weekly refresh CronJob.
