# Default values for notdawa. Everything here is generic — no secrets, no
# environment-specific hostnames. Override per-environment with your own values
# file (e.g. values.devspace.yaml) or a Flux HelmRelease `values:` block.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/karbowiak/notdawa
  # Defaults to .Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Names of pre-existing image pull secrets (for private registries).
imagePullSecrets: []

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
# The chart renders a Secret from the values below. To supply secrets out of
# band instead (recommended for GitOps), set `existingSecret` to the name of a
# Secret that carries these keys: POSTGRES_PASSWORD, DATAFORDELER_API_KEY and
# (optionally) GSEARCH_TOKEN.
secret:
  existingSecret: ""
  # Datafordeler apiKey — required for `import`/refresh, unused by `serve`.
  datafordelerApiKey: ""
  # Optional GSSearch token (autocomplete cross-check).
  gsearchToken: ""

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
database:
  # Full DSN of an EXTERNAL Postgres+PostGIS. When set, the bundled postgres is
  # not deployed and this connection string is used verbatim. Leave empty to use
  # the in-chart database below.
  url: ""
  # sslmode used when the DSN is assembled from the bundled postgres values.
  sslmode: disable

postgres:
  enabled: true
  # Multi-arch PostGIS build (matches the project's docker-compose).
  image: imresamu/postgis:17-3.5
  imagePullPolicy: IfNotPresent
  auth:
    username: notdawa
    database: notdawa
    # REQUIRED when postgres.enabled and no existingSecret is provided.
    password: ""
  persistence:
    enabled: true
    storageClass: longhorn
    size: 50Gi
    # Annotate the PVC so it survives `helm uninstall` (the data is expensive to
    # rebuild — a full import is ~8 GB and a few hours).
    keep: true
  # pgx pool_max_conns appended to the assembled DSN: 2 server replicas + the
  # import/provision jobs stay well inside max_connections below.
  poolMaxConns: 16
  # Postgres tuning for the ~14 GB dataset inside the 4Gi memory limit on SSD
  # (longhorn). shared_buffers 25% of the limit; effective_cache_size tells the
  # planner about the container page cache; random_page_cost 1.1 biases toward
  # the index plans this workload wants; jit off — these are sub-second OLTP
  # plans where JIT compile time only hurts; maintenance_work_mem sized for the
  # weekly index rebuilds on multi-million-row reloads.
  args:
    - -c
    - max_connections=80
    - -c
    - shared_buffers=1GB
    - -c
    - effective_cache_size=3GB
    - -c
    - work_mem=32MB
    - -c
    - maintenance_work_mem=256MB
    - -c
    - random_page_cost=1.1
    - -c
    - jit=off
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  # The official postgres entrypoint runs as this uid directly (skipping its
  # root chown/su path); PGDATA on the existing PVC is owned by 999 (verified
  # against the live volume before this default changed).
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# API server (`notdawa serve`)
# ---------------------------------------------------------------------------
server:
  replicas: 2
  # The host used in generated hrefs. Keep DAWA's default for byte-compatible
  # responses; point at your own host only if clients should follow links back
  # to this mirror.
  baseURL: https://api.dataforsyningen.dk
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  service:
    type: ClusterIP
    port: 80
  # Keep one replica up through other tenants' node drains (shared cluster).
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Schema migrations (`notdawa migrate`)
# ---------------------------------------------------------------------------
# Run as a Helm post-install/post-upgrade hook so the schema is applied once per
# release operation (no multi-replica race).
migrate:
  enabled: true
  # Helm WAITS on hooks (disableWaitForJobs does not apply): a genuinely broken
  # migration must fail the release fast, not crash-loop for half an hour.
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# ---------------------------------------------------------------------------
# Data import (`notdawa import`)
# ---------------------------------------------------------------------------
import:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
      # Reserve the scratch emptyDir at scheduling time so a ~15 GB weekly
      # download cannot create disk pressure that evicts other tenants' pods.
      ephemeral-storage: 20Gi
    limits:
      memory: 8Gi
      ephemeral-storage: 24Gi
  # Scratch space for downloaded extracts (TMPDIR). A full run streams ~15 GB
  # (8 current + 6.7 bitemporal).
  tmpSize: 20Gi

  # Weekly refresh. Datafordeler republishes each register once a week (DAR Sat,
  # DAGI+MAT Sun, DS Mon); Tuesday 04:00 lands after them all.
  cron:
    enabled: true
    schedule: "0 4 * * 2"
    timeZone: Europe/Copenhagen
    target: all
    # 12 h: the deadline caps the whole Job INCLUDING its retries, and
    # Datafordeler stalls regularly — a lost week of data is worse than a
    # long-running Tuesday job.
    activeDeadlineSeconds: 43200
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3

# ---------------------------------------------------------------------------
# Data provisioning (`notdawa provision`)
# ---------------------------------------------------------------------------
# A Job per install/upgrade that imports whatever plan data the database is
# missing (tracked in the data_provisions ledger): new entities added by a
# release get their data on deploy instead of waiting for the weekly refresh,
# and on a fresh install this performs the full initial load (~8 GB, a few
# hours). When everything is already provisioned it exits in seconds. Runs
# async — the rollout does not wait for it. Uses `import.resources`/`tmpSize`.
provision:
  enabled: true
  # Safety cap so a stuck run cannot block forever (6 h — sized for the full
  # fresh-install load).
  activeDeadlineSeconds: 21600

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  hosts:
    - notdawa.com
  # Extra annotations merged onto the Ingress.
  annotations: {}
  # Body/response tuning for an address API behind a CDN.
  proxyBodySize: 1m
  # Cache-Control added by the ingress to successful responses so an upstream
  # CDN (Cloudflare) can cache at the edge. Empty disables the header.
  cacheControl: "public, max-age=300"
  tls:
    enabled: true
    # cert-manager ClusterIssuer that issues the certificate (DNS-01 here).
    clusterIssuer: letsencrypt
    secretName: notdawa-tls

# fsGroup/runAsUser for the notdawa (app) pods. Matches the image's user so the
# /tmp emptyDir is writable during imports.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# ---------------------------------------------------------------------------
# NetworkPolicy
# ---------------------------------------------------------------------------
# Default-deny ingress for the namespace plus the two allowances the app needs:
# ingress-controller → server :8080 and app pods → postgres :5432. Essential on
# a shared cluster — without it every pod of every tenant can reach the
# password-only postgres. Extra peers (e.g. a Tailscale operator proxy that
# should reach postgres) go in postgresExtraFrom as raw NetworkPolicyPeer
# entries.
networkPolicy:
  enabled: false
  # Namespace running the ingress controller (matched on the standard
  # kubernetes.io/metadata.name label).
  ingressNamespace: ingress-nginx
  # Additional NetworkPolicyPeer entries allowed to reach postgres :5432.
  postgresExtraFrom: []
