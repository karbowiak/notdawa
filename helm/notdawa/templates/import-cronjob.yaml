{{- if .Values.import.cron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "notdawa.fullname" . }}-import
  labels:
    {{- include "notdawa.labels" . | nindent 4 }}
    app.kubernetes.io/component: import
spec:
  schedule: {{ .Values.import.cron.schedule | quote }}
  {{- with .Values.import.cron.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.import.cron.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.import.cron.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.import.cron.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "notdawa.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: import
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            {{- include "notdawa.waitForDb" . | nindent 12 }}
          containers:
            - name: import
              image: {{ include "notdawa.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["import", {{ .Values.import.cron.target | quote }}]
              env:
                - name: TMPDIR
                  value: /tmp
                {{- include "notdawa.appEnv" . | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              {{- with .Values.import.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: {{ .Values.import.tmpSize }}
{{- end }}
