{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "notdawa.fullname" . }}
  labels:
    {{- include "notdawa.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.proxyBodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.cacheControl }}
    # Let an upstream CDN (Cloudflare) cache successful GETs at the edge.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Cache-Control: {{ . }}";
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "notdawa.fullname" $ }}
                port:
                  number: {{ $.Values.server.service.port }}
    {{- end }}
{{- end }}
