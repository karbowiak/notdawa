apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notdawa.fullname" . }}
  labels:
    {{- include "notdawa.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "notdawa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "notdawa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- with .Values.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # The server never talks to the Kubernetes API; don't hand an attacker a
      # cluster credential on the internet-facing pods.
      automountServiceAccountToken: false
      # Drain margin: `serve` shuts down gracefully within 25s of SIGTERM.
      terminationGracePeriodSeconds: 40
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "notdawa.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
      initContainers:
        {{- include "notdawa.waitForDb" . | nindent 8 }}
      containers:
        - name: server
          image: {{ include "notdawa.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "notdawa.containerSecurityContext" . | nindent 12 }}
          args:
            - serve
            - --addr
            - ":8080"
            - --base-url
            - {{ .Values.server.baseURL | quote }}
          # dbEnv only — serve never reads the Datafordeler/GSSearch credentials.
          env:
            {{- include "notdawa.dbEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          # /healthz: process alive (no DB). /readyz: bounded DB ping — stays fast
          # even while a bulk import loads the database.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # Writable scratch for the read-only root filesystem.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "notdawa.fullname" . }}
  labels:
    {{- include "notdawa.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "notdawa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
{{- if .Values.server.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "notdawa.fullname" . }}
  labels:
    {{- include "notdawa.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  minAvailable: {{ .Values.server.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "notdawa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
