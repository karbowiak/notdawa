{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notdawa.secretName" . }}
  labels:
    {{- include "notdawa.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATAFORDELER_API_KEY: {{ .Values.secret.datafordelerApiKey | quote }}
  GSEARCH_TOKEN: {{ .Values.secret.gsearchToken | quote }}
  {{- if and .Values.postgres.enabled (not .Values.database.url) }}
  {{- if not .Values.postgres.auth.password }}
  {{- fail "postgres.auth.password is required (or set secret.existingSecret / database.url)" }}
  {{- end }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  {{- end }}
{{- end }}
