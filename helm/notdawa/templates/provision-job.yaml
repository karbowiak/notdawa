{{- if .Values.provision.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # Jobs are immutable, so name per release revision: every install/upgrade
  # gets a fresh run (Helm prunes the previous revision's Job, the TTL reaps
  # completed ones). `notdawa provision` diffs the import plan against the
  # data_provisions ledger, so a run with nothing new exits in seconds — and on
  # an empty database it performs the full initial load.
  name: {{ include "notdawa.fullname" . }}-provision-r{{ .Release.Revision }}
  labels:
    {{- include "notdawa.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision
spec:
  # Not a Helm hook: provisioning may download gigabytes, and the rollout must
  # not wait on it. Retries resume from the ledger (completed steps are skipped).
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: {{ .Values.provision.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "notdawa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: provision
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "notdawa.waitForDb" . | nindent 8 }}
      containers:
        - name: provision
          image: {{ include "notdawa.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "notdawa.containerSecurityContext" . | nindent 12 }}
          args: ["provision"]
          env:
            - name: TMPDIR
              value: /tmp
            {{- include "notdawa.appEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with .Values.import.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.import.tmpSize }}
{{- end }}
